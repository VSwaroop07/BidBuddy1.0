services:
  # ── Web Service (Django + Gunicorn) ──────────────────────────────────────────
  - type: web
    name: bitbuddy
    env: python
    region: oregon
    plan: free                          # ✅ Free tier (sleeps after 15 min idle)
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application --workers=1 --threads=2 --timeout=120 --log-level=info
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: WEB_CONCURRENCY
        value: 1
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECRET_KEY
        generateValue: true             # Render auto-generates a secure key
      - key: DATABASE_URL
        fromDatabase:
          name: bitbuddy-db
          property: connectionString
      # ── Set these manually in the Render dashboard ────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

# ── Managed PostgreSQL Database ───────────────────────────────────────────────
# ✅ Free tier — NOTE: expires after 90 days, then you must recreate it
databases:
  - name: bitbuddy-db
    databaseName: bitbuddy
    user: bitbuddy
    plan: free