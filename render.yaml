services:
  # ── Web Service (Django + Gunicorn) ──────────────────────────────────────────
  - type: web
    name: bitbuddy
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      apt-get update && apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn config.wsgi:application --workers=2 --threads=2 --timeout=120 --max-requests=500 --log-level=info
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: WEB_CONCURRENCY
        value: 2
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure key
      - key: DATABASE_URL
        fromDatabase:
          name: bitbuddy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bitbuddy-redis
          type: redis
          property: connectionString
      # ── Set these manually in the Render dashboard ────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # ── Paths for system tools installed during build ────────────────────────
      - key: POPPLER_PATH
        value: /usr/bin
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract

  # ── Celery Worker ────────────────────────────────────────────────────────────
  - type: worker
    name: bitbuddy-celery
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: bitbuddy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bitbuddy-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: bitbuddy
          type: web
          envVarKey: SECRET_KEY
      - key: GEMINI_API_KEY
        sync: false

# ── Managed PostgreSQL Database ───────────────────────────────────────────────
databases:
  - name: bitbuddy-db
    databaseName: bitbuddy
    user: bitbuddy
    plan: starter

# ── Managed Redis ─────────────────────────────────────────────────────────────
  - type: redis
    name: bitbuddy-redis
    plan: starter
    maxmemoryPolicy: noeviction